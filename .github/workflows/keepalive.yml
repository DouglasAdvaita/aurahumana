name: Keep Render and Neon alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (Render + Neon)
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          URL="${RENDER_URL:-https://aurahumana.onrender.com}"
          URL="${URL%/}"
          for i in 1 2; do
            echo "Ping $i -> $URL/health"
            curl -fsS --max-time 60 "$URL/health" || true
            if [ "$i" = "1" ]; then sleep 120; fi
          done
