<script>
const D=[[1,"Lo Creativo","Del silencio inerte al impulso de manifestación<br>Surge el primer impulso Yang de <b>hacer ruido</b> y emitir sonido para gritar al universo que existimos, necesitando desesperadamente ser escuchados<br><b>Expresar la existencia:</b> Brinda voz a la fuerza creadora inicial","\ud83c\udfa8",-14838],[2,"El Receptivo","De la voz abstracta al vehículo corporal<br>El principio Yin absorbe el sonido creador y moldea la <b>forma biológica</b>, dando dirección y vehículo tangible a la vida<br><b>Dar contención:</b> Provee la forma física necesaria para que el impulso exista","\ud83e\udded",-14526],[3,"La Dificultad Inicial","De la forma inerte a la carga biológica<br>Inicia la <b>reproducción biológica</b> y la mutación genómica; el sexo aparece obligando a cuidar a las crías indefensas por años<br><b>Continuidad genética:</b> Resuelve la extinción mediante la multiplicación de la especie","\ud83e\uddec",-14214],[4,"La Locura Juvenil","Del mero instinto animal a la mente inquieta<br>Se pierde la inocencia biológica y nace la <b>capacidad de entendimiento</b> de nuestra propia naturaleza más allá de lo puramente instintivo<br><b>Comprensión:</b> Satisface la necesidad de entender las leyes de la vida","\ud83d\udca1",-13901],[5,"La Espera","De la recolección fortuita a la rutina rítmica<br>La relación de la mente con el reino vegetal da origen a la <b>agricultura primordial</b> y a la fijación de patrones alimentarios<br><b>Supervivencia alimentaria:</b> Elimina la hambruna fijando un ritmo de cultivo","\u23f3",-13589],[6,"El Conflicto","De la respuesta química al erotismo consciente<br>Se activa el motor del Plexo Solar, introduciendo la <b>sexualidad erótica</b> y las crisis emocionales en las relaciones humanas<br><b>Intimidad profunda:</b> Vincula a los individuos mediante el despertar emocional","\ud83d\udee1",-13277],[7,"El Ejercito","De la disputa entre vecinos al desplazamiento ordenado<br>Surgen los <b>pastores y líderes</b> para guiar a la tribu hacia valles fértiles cuando el conflicto local impide la convivencia<br><b>Dirección social:</b> Resuelve la desorientación en las migraciones tribales","\ud83e\uddd1\u200d\u2708\ufe0f",-12964],[8,"La Solidaridad","De la masa anónima al modelo individual<br>La tristeza y melancolía del individuo impulsan la <b>expresión artística individual</b> y el liderazgo por conducta<br><b>Inspiración comunitaria:</b> Muestra nuevos caminos de vida a la tribu","\ud83c\udf81",-12652],[9,"Lo Pequeno","De las metas apresuradas a la disciplina paciente<br>Se desarrolla la <b>investigación metódica de los detalles</b>; el ser humano aprende a avanzar paso a paso de forma humilde<br><b>Continuidad lógica:</b> Permite construir conocimientos complejos a largo plazo","\ud83d\udd0d",-12340],[10,"El Porte","Del azar ambiental a la conducta adaptativa<br>Se afianzan <b>patrones de comportamiento y adaptación</b> física que aseguran estar despiertos dentro del entorno hostil<br><b>Preservación física:</b> Evita la mortalidad prematura ante los peligros del entorno","\ud83e\ude9e",-12027],[11,"La Paz","Del grito instintivo a la transmisión de historias<br>Ocurre la mutación biológica que da origen al <b>lenguaje articulado</b> y la <b>tradición oral</b>, enseñando a través del recuerdo del pasado<br><b>Memoria colectiva:</b> Preserva las lecciones de los antepasados para el futuro","\ud83d\udcad",-11715],[12,"El Aquietamiento","De la historia fáctica a la devoción mística<br>La voz adquiere matices poéticos; nacen los <b>cánticos y danzas rituales</b> para conmover y mutar el espíritu del grupo<br><b>Romance con la vida:</b> Satisface la necesidad de trascendencia espiritual","\ud83c\udfa4",-11403],[13,"Comunidad con los Hombres","De la vivencia abierta a la custodia del misterio<br>La tribu empieza a recopilar historias compartidas y nacen los <b>conocimientos secretos</b> y las tradiciones ocultas<br><b>Preservación de la identidad:</b> Guarda la experiencia colectiva bajo reserva","\ud83d\udc42",-11090],[14,"Posesion en Gran Medida","Del trueque directo e ineficiente a la energía abstracta<br>Nace el <b>dinero</b> como medio de intercambio de recursos energéticos, impulsando la <b>especialización del trabajo</b><br><b>Eficacia laboral:</b> Evita que cada persona tenga que fabricar todo por sí misma","\ud83d\udcb0",-10778],[15,"La Modestia","Del nomadismo errante al dominio de la tierra<br>El perfeccionamiento de la agricultura permite los <b>asentamientos humanos permanentes</b>, abandonando la caza y el nomadismo<br><b>Estabilidad geográfica:</b> Sostiene a civilizaciones complejas en un solo lugar","\ud83c\udf17",-10466],[16,"El Entusiasmo","De la producción agrícola a la invención técnica<br>El tiempo libre de los asentamientos permite la <b>construcción de herramientas e instrumentos</b> perfeccionados<br><b>Facilitación del trabajo:</b> Modifica la naturaleza mediante la tecnología","\ud83c\udfb8",-10153],[17,"El Seguimiento","Del genio artesanal a la organización jerárquica<br>Surgen las <b>jerarquías y opiniones organizativas</b> para dirigir a la masa de la población que carece de criterio propio<br><b>Orden social:</b> Organiza a la comunidad bajo autoridades visibles","\ud83e\udd14",-9841],[18,"Trabajo en lo Estropeado","Del dogma autoritario a la fiscalización de la justicia<br>Nace la figura del <b>juez</b> para cuestionar a los líderes y corregir abusos, asentando las bases del <b>estado de derecho</b><br><b>Protección contra la tiranía:</b> Garantiza la justicia equilibrando el poder","\ud83d\udd28",-9529],[19,"El Acercamiento","De la ley humana frágil a la autoridad divina<br>Cuando las normas terrenales fallan, la tribu inventa la <b>idea de Dios y la religión</b> como pegamento unificador e infranqueable<br><b>Cohesión moral:</b> Une a la tribu bajo un icono sagrado indiscutible","\ud83e\udef4",-9217],[20,"La Contemplacion","De los dogmas abstractos al presente vivo<br>Aparece el individuo despierto en el presente, capaz de manifestar lo divino en lo cotidiano y mutar a su tribu<br><b>Conexión real:</b> Saca a la comunidad de la noche de la ignorancia","\u26a1",-8904],[21,"La Mordedura Tajante","De la iluminación personal a la regulación comunitaria<br>Se estructura la <b>burocracia tribal</b>, que toma control estricto sobre vestimenta, comida, trabajo y vivienda<br><b>Control del caos:</b> Administra equitativamente los recursos materiales","\ud83d\udd79",-8592],[22,"La Gracia","De la frialdad burocrática a la empatía relacional<br>Se desarrolla el <b>saber escuchar</b> a través del canal emocional, transformando la interacción social con arte y gracia<br><b>Humanización social:</b> Permite la comunicación mutante mediante el sentimiento","\ud83c\udf39",-8280],[23,"El Fraccionamiento","De la emoción compartida a la lógica individual<br>Entra en el mundo la expresión mental \"Yo sé\", permitiendo pensar de manera autónoma sin depender de dogmas colectivos<br><b>Estructuración mental:</b> Aporta eficacia al pensamiento analítico individual","\ud83d\udde3",-7967],[24,"El Retorno","Del pensamiento abstracto a la obra perdurable<br>Nacen las <b>artes plásticas</b> y se inventa el <b>alfabeto</b> para fijar conceptos y retratar la existencia como una obra<br><b>Plasmación del saber:</b> Permite plasmar y transmitir ideas complejas mediante símbolos","\u262f",-7655],[25,"La Inocencia","Del arte espontáneo al templo organizado<br>Aparecen los <b>sacerdotes y chamanes</b>, quienes aprisionan el arte bajo dogmas sagrados y compiten por la supremacía de sus dioses<br><b>Estructuración espiritual:</b> Canaliza la devoción religiosa organizada","\ud83e\udd0d",-7343],[26,"Lo Grande","De la guerra de aniquilamiento a la negociación<br>Nace el <b>comercio tribal</b> de excedentes; las tribus aprenden que es más lucrativo venderle al vecino que matarlo<br><b>Convivencia pacífica:</b> Sustituye la violencia por el interés económico mutuo","\ud83c\udfa9",-7030],[27,"La Nutricion","De la prole indiferenciada a la familia legal<br>Se establecen las <b>leyes de primogenitura</b> y nombres formales para otorgar derechos a los descendientes legítimos<br><b>Protección a la infancia:</b> Asegura los recursos y amparo a las nuevas generaciones","\ud83e\udd32",-6718],[28,"Preponderancia de lo Grande","Del linaje familiar al desafío personal<br>El individuo desafía las creencias heredadas enfrentando su <b>miedo a la muerte</b> e insiste en saber el propósito de su vida por sí mismo<br><b>Certeza individual:</b> Descarta lo que no puede ser comprobado en la experiencia propia","\u2694",-6406],[29,"Lo Abismal","Del objetivo personal a la meta colectiva<br>La humanidad asume un <b>compromiso incondicional con la excelencia</b> en todas sus empresas biológicas y sociales<br><b>Superación de la mediocridad:</b> Impulsa a la especie a perseguir grandes ideales","\u270b",-6093],[30,"El Fuego Adherente","Del logro alcanzado al anhelo incesante<br>Se enciende el <b>fuego insaciable del deseo</b>, una insatisfacción química que impide al ser humano acomodarse<br><b>Evolución continua:</b> Obliga a la especie a buscar constantemente nuevos valles","\ud83d\udd25",-5781],[31,"La Influencia","De los jefes tribales hereditarios a la elección pública<br>Nace la <b>democratización y la política</b>, permitiendo a la sociedad elegir a sus líderes según sus méritos<br><b>Representación popular:</b> Otorga el poder de mando a líderes electos por el pueblo","\ud83d\udce2",-5469],[32,"La Duracion","Del gobernante electo a la preservación genético-cultural<br>La tribu, temerosa de la extinción, instituye la <b>educación institucionalizada</b> para transmitir el saber acumulado<br><b>Perpetuación de habilidades:</b> Garantiza que la cultura y supervivencia no se pierdan","\ud83d\udee3",-5156],[33,"La Retirada","De la supervisión comunitaria constante al espacio íntimo<br>Se consagra la <b>privacidad e individualidad territorial</b> (el hogar propio) para proteger al individuo del condicionamiento social<br><b>Descondicionamiento:</b> Permite al ser humano descansar en su propia naturaleza","\ud83d\udcbe",-4844],[34,"El Poder de lo Grande","Del aislamiento privado a la fuerza productiva<br>Despunta la era de la <b>industrialización</b> y la consolidación de la <b>clase media trabajadora</b> centrada en la producción material<br><b>Abastecimiento masivo:</b> Satisface la demanda de bienes materiales de la sociedad","\ud83d\udcaa",-4532],[35,"El Progreso","De la ilusión del avance ilimitado al aprendizaje por dolor<br>Emerge el <b>talento empírico</b> derivado de tropezar con las crisis que genera el afán de progreso desmedido<br><b>Madurez por experiencia:</b> Enseña la sabiduría práctica tras el fracaso de utopías","\ud83d\ude80",-4219],[36,"Oscurecimiento de la Luz","De la ilusión del avance ilimitado al aprendizaje por dolor<br>Emerge el <b>talento empírico</b> derivado de tropezar con las crisis que genera el afán de progreso desmedido<br><b>Madurez por experiencia:</b> Enseña la sabiduría práctica tras el fracaso de utopías","\ud83c\udf0a",-3907],[37,"El Clan","Del matriarcado primordial al orden familiar estructurado<br>Transición hacia la <b>familia patrilineal</b> e imposición de roles claros entre el padre y la madre en el hogar<br><b>Estructura civilizatoria:</b> Sienta la base del modelo social tradicional","\ud83c\udfe0",-3595],[38,"La Oposicion","De la obediencia a las costumbres a la búsqueda de certezas<br>Aparece el luchador que exige información y combate para encontrar su <b>propia verdad individual</b><br><b>Discernimiento personal:</b> Impide la sumisión ciega a las verdades impuestas","\ud83e\udd4a",-3282],[39,"El Impedimento","De la verdad fría al amor químico-espiritual<br>Búsqueda del <b>amor trascendente</b>, impulsada por cambios en la química corporal, la dieta y la frecuencia feromonal<br><b>Elevación de la conciencia:</b> Prepara el espíritu para niveles superiores de empatía","\ud83d\ude08",-2970],[40,"La Liberacion","Del romance idealizado al pacto contractual<br>Se establece la <b>institucionalización del contrato familiar</b>, fijando acuerdos equitativos de convivencia y divorcio<br><b>Justicia operacional:</b> Brinda reglas claras para el sostén de la comunidad familiar","\ud83e\udd1d",-2658],[41,"El Decrecimiento","De las eras preparatorias al ensayo de la historia<br>Se inicia la <b>ronda civilizadora moderna</b> (hace unos 4,000 años), utilizando la memoria del pasado para proyectar el futuro<br><b>Arranque civilizatorio:</b> Da comienzo al ciclo formal de desarrollo humano","\ud83c\udf31",-2345],[42,"El Aumento","De proyectos efímeros a la conservación de tradiciones<br>La humanidad aprende a <b>preservar y reciclar estilos de vida del pasado</b> para madurar su presente<br><b>Enriquecimiento histórico:</b> Evita repetir errores reciclando la sabiduría previa","\ud83d\udcc8",-2033],[43,"La Resolucion","De la costumbre ineficiente a la optimización técnica<br>Surge la innovación dedicada a lograr la <b>eficiencia en la distribución de recursos</b> y simplificar la vida<br><b>Optimización existencial:</b> Minimiza el desgaste energético para sobrevivir","\ud83d\udc8e",-1721],[44,"Ir al Encuentro","Del consumo inmediato a la previsión bursátil<br>Se desarrolla el <b>olfato financiero y de mercado</b>, anticipando tendencias para garantizar el bienestar futuro<br><b>Previsión material:</b> Previene quiebras económicas gestionando el mañana","\ud83d\udc3e",-1409],[45,"La Reunion","De feudos aislados a grandes imperios<br>Se unifican pequeñas tribus para formar <b>naciones, países y monarquías centralizadas</b> bajo un solo monarca<br><b>Poderío a gran escala:</b> Garantiza la defensa y riqueza mediante unidades territoriales","\ud83d\udc51",-1096],[46,"Empujando Hacia Arriba","Del cálculo estratégico a la sincronicidad afortunada<br>Se descubre la <b>serendipia y la buena suerte</b> que surgen de entregarse al cuerpo sin forzar resultados<br><b>Fluidez existencial:</b> Libera del estr
